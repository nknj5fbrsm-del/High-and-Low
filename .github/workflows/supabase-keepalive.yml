# Hält das Free-Tier-Supabase-Projekt wach (Pause nach ~7 Tagen Inaktivität).
# Echte DB-Query über PostgREST — Auth-Health allein reicht nicht.
# Kann ein bereits pausiertes Projekt NICHT fortsetzen → Dashboard → Resume.
name: Supabase keep-alive

on:
  schedule:
    # 2× täglich UTC — GitHub-Cron driftet oft um Stunden; 2×/Woche war zu dünn
    - cron: '17 5 * * *'
    - cron: '17 17 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping rooms table
        env:
          # Öffentliche Client-URL + Publishable Key (liegen auch im Frontend-Bundle).
          # Optional: Repo-Secrets SUPABASE_URL / SUPABASE_KEY überschreiben die Defaults.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -euo pipefail
          URL="${SUPABASE_URL:-https://dbqtwdtmovzrsmgsszmo.supabase.co}"
          KEY="${SUPABASE_KEY:-sb_publishable_pQ98hjY5Zsdg9Uj2viPk4w_GeZzjpbN}"
          URL="${URL%/}"

          attempt_ping() {
            curl -sS -o /tmp/sb-keepalive.json -w '%{http_code}' \
              "${URL}/rest/v1/rooms?select=room_code&limit=1" \
              -H "apikey: ${KEY}" \
              -H "Authorization: Bearer ${KEY}" \
              -H "Accept: application/json" \
              -H "Prefer: count=exact"
          }

          code=""
          for i in 1 2 3 4 5; do
            code=$(attempt_ping || true)
            echo "Versuch ${i}: HTTP ${code}"
            cat /tmp/sb-keepalive.json 2>/dev/null || true
            echo
            if [ "$code" = "200" ] || [ "$code" = "206" ]; then
              echo "Keep-alive ok"
              exit 0
            fi
            # 521/546 = Origin down / pausiert oder noch am Hochfahren
            if [ "$i" -lt 5 ]; then
              sleep $((i * 20))
            fi
          done

          if [ "$code" = "521" ] || [ "$code" = "546" ] || [ "$code" = "000" ]; then
            echo "Keep-alive failed — Projekt pausiert oder unerreichbar."
            echo "Im Supabase-Dashboard Resume tippen, danach Actions → Supabase keep-alive → Run workflow."
          else
            echo "Keep-alive failed — HTTP ${code}. Key/URL prüfen oder Dashboard öffnen."
          fi
          exit 1

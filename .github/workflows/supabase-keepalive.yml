# Hält das Free-Tier-Supabase-Projekt wach (Pause nach ~7 Tagen Inaktivität).
# Echte DB-Query über PostgREST — Auth-Health allein reicht nicht.
name: Supabase keep-alive

on:
  schedule:
    # Dienstag + Freitag 06:17 UTC — mind. 2× pro Woche
    - cron: '17 6 * * 2,5'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping rooms table
        env:
          # Öffentliche Client-URL + Publishable Key (liegen auch im Frontend-Bundle)
          SUPABASE_URL: https://dbqtwdtmovzrsmgsszmo.supabase.co
          SUPABASE_KEY: sb_publishable_pQ98hjY5Zsdg9Uj2viPk4w_GeZzjpbN
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/sb-keepalive.json -w '%{http_code}' \
            "${SUPABASE_URL}/rest/v1/rooms?select=room_code&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Accept: application/json")
          echo "HTTP ${code}"
          cat /tmp/sb-keepalive.json
          echo
          if [ "$code" != "200" ] && [ "$code" != "206" ]; then
            echo "Keep-alive failed — Projekt ggf. pausiert: im Supabase-Dashboard Resume tippen."
            exit 1
          fi
